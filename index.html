<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christopher Tyler | AI Motion + Creative AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-offwhite': '#F4F4F0',
                        'brand-grey': '#8A8D91',
                        'brand-charcoal': '#1C1D21',
                        'brand-cyan': '#00F0FF',
                        'brand-lime': '#D4FF00',
                        'brand-violet': '#8A2BE2',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #F4F4F0;
            color: #1C1D21;
            scroll-behavior: smooth;
        }

        .nav-link {
            position: relative;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background-color: #00F0FF;
            transition: width 0.3s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }

        /* Site background */
        .bg-grid {
            background-color: #F4F4F0;
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Iframe transition smoothness */
        iframe {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="font-sans antialiased h-screen overflow-hidden flex flex-col bg-grid">

    <main class="flex-grow pt-4 pb-2 px-4 md:px-8 max-w-7xl mx-auto w-full flex flex-col min-h-0">
        
        <!-- Header Identity -->
        <header class="mb-2 max-w-full ml-auto text-right flex flex-col items-end shrink-0">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold tracking-tighter text-brand-charcoal mb-1 leading-tight">
                CHRISTOPHER TYLER
            </h1>
            
            <!-- Subtitle and Navigation Inline -->
            <div class="flex flex-row items-center justify-end">
                <h2 class="text-sm md:text-lg lg:text-xl font-mono text-brand-cyan border-r-4 border-brand-lime pr-4 py-1 inline-block">
                    CREATIVE AI MULTIMEDIA PORTFOLIO
                </h2>
                
                <nav class="flex space-x-3 md:space-x-5 text-[10px] md:text-xs font-mono tracking-wider pl-4">
                    <a href="#" onclick="goHome(); return false;" class="nav-link text-brand-charcoal font-semibold">INDEX</a>
                    <a href="#" onclick="loadProject('about.html'); return false;" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">ABOUT</a>
                    <a href="portfolio.pdf" target="_blank" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">PDF</a>
                    <a href="#" onclick="loadProject('contact.html'); return false;" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">CONTACT</a>
                </nav>
            </div>
        </header>

        <!-- Dynamic Frame Area -->
        <div class="relative w-full flex-grow min-h-0 mt-2">
            
            <!-- Tiny Back Button (Positioned just above the black frame) -->
            <button id="back-btn" onclick="goHome()" style="display: none;" class="absolute -top-6 left-0 font-mono text-xs font-bold text-brand-charcoal hover:text-brand-violet transition-colors flex items-center z-10 cursor-pointer">
                <span class="mr-1">←</span> BACK
            </button>

            <!-- The Iframe loading indexpanel.html by default -->
            <iframe id="portfolio-frame" src="indexpanel.html" title="Portfolio Content" class="absolute inset-0 w-full h-full bg-black rounded-xl shadow-2xl border-4 border-black" frameborder="0"></iframe>

        </div>
    </main>

    <footer class="bg-brand-offwhite shrink-0 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-1 flex justify-center items-center">
            <p class="font-mono text-brand-grey text-[10px]">
                &copy; <script>document.write(new Date().getFullYear())</script> Christopher Tyler. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        const frame = document.getElementById('portfolio-frame');
        const backBtn = document.getElementById('back-btn');

        // Listen for messages coming from the iframe
        window.addEventListener('message', function(event) {
            if (event.data && event.data.action === 'loadProject') {
                loadProject(event.data.url);
            }
        });

        // This function executes the frame change
        function loadProject(url) {
            frame.style.opacity = '0';
            setTimeout(() => {
                frame.src = url;
                backBtn.style.display = 'inline-flex';
                frame.style.opacity = '1';
                
                // Scroll up smoothly to the top of the frame
                document.getElementById('portfolio-frame').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // Returns to the grid
        function goHome() {
            frame.style.opacity = '0';
            setTimeout(() => {
                frame.src = 'indexpanel.html';
                backBtn.style.display = 'none';
                frame.style.opacity = '1';
            }, 300);
        }
    </script>
</body>
</html>
