<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Christopher Tyler | AI Motion + Creative AI</title><link rel="icon" type="image/png" href="icon.png"><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{'brand-offwhite':'#F4F4F0','brand-grey':'#8A8D91','brand-charcoal':'#1C1D21','brand-cyan':'#00F0FF','brand-lime':'#D4FF00','brand-violet':'#8A2BE2'},fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{width:100%;height:100%}body{background:#F4F4F0;color:#1C1D21}.nav-link{position:relative;color:#8A8D91;font-weight:500}.nav-link.active{color:#1C1D21!important;font-weight:700}.nav-link::after{content:'';position:absolute;width:0;height:2px;bottom:-4px;left:0;background:#00F0FF;transition:width .2s ease}.nav-link:hover::after{width:100%}.bg-grid{position:relative;background-color:#F4F4F0;background-image:url('bg.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}.bg-grid::before{content:'';position:fixed;inset:0;background:rgba(255,255,255,.25);pointer-events:none;z-index:0}.bg-grid>main,.bg-grid>footer{position:relative;z-index:1}header h1{filter:drop-shadow(0 3px 2px rgba(0,0,0,.38)) drop-shadow(0 6px 9px rgba(0,0,0,.29))}header h2{position:relative;border-right:0!important;margin-right:4px;text-shadow:0 2px 1px #001130,0 4px 5px #001130,0 0 11px #001130}header h2::after{content:'';position:absolute;top:3px;bottom:3px;right:-4px;width:4px;background:#D4FF00;box-shadow:3px 2px 1px #435100,5px 4px 8px #435100}header nav,#back-btn,#next-btn{filter:drop-shadow(0 2px 2px rgba(0,0,0,.78))}#portfolio-frame{display:block;box-shadow:0 14px 32px rgba(0,0,0,.78),0 4px 10px rgba(0,0,0,.88),0 0 0 1px rgba(0,0,0,.95)}footer{background:transparent!important;filter:none!important;text-shadow:none!important}footer p{color:#000!important;text-shadow:none!important;filter:none!important}</style></head><body class="font-sans antialiased h-screen overflow-hidden flex flex-col bg-grid"><main class="flex-grow pt-4 pb-2 px-4 md:px-8 max-w-7xl mx-auto w-full flex flex-col min-h-0"><header class="mb-2 max-w-full ml-auto text-right flex flex-col items-end shrink-0"><h1 class="text-4xl md:text-5xl lg:text-6xl font-bold tracking-tighter text-brand-charcoal mb-1 leading-tight">CHRISTOPHER TYLER</h1><div class="flex flex-row items-center justify-end"><h2 class="text-sm md:text-lg lg:text-xl font-mono text-brand-cyan pr-4 py-1 inline-block">CREATIVE AI MULTIMEDIA PORTFOLIO</h2><nav class="flex space-x-3 md:space-x-5 text-[10px] md:text-xs font-mono tracking-wider pl-4"><a id="nav-index" href="indexpanel.html" target="portfolio-frame" onclick="showIndex()" class="nav-link active hover:text-brand-cyan transition-colors">INDEX</a><a id="nav-process" href="process/index.html" target="portfolio-frame" onclick="showBack();setActiveNav('process/index.html')" class="nav-link hover:text-brand-cyan transition-colors">PROCESS</a><a id="nav-pdf" href="portfolio.pdf" target="_blank" class="nav-link hover:text-brand-cyan transition-colors">PDF</a><a id="nav-contact" href="contact.html" target="portfolio-frame" onclick="showBack();setActiveNav('contact.html')" class="nav-link hover:text-brand-cyan transition-colors">CONTACT</a></nav></div></header><div class="relative w-full flex-grow min-h-0 mt-2"><div class="absolute -top-6 left-0 z-10 flex items-center gap-5"><button id="back-btn" onclick="goHome()" style="display:none" class="font-mono text-xs font-bold text-brand-charcoal hover:text-brand-violet transition-colors items-center cursor-pointer"><span class="mr-1">←</span> BACK</button><button id="next-btn" onclick="goNext()" style="display:none" class="font-mono text-xs font-bold text-brand-charcoal hover:text-brand-cyan transition-colors items-center cursor-pointer">NEXT <span class="ml-1">→</span></button></div><iframe id="portfolio-frame" name="portfolio-frame" src="indexpanel.html" title="Portfolio Content" class="absolute inset-0 w-full h-full bg-black rounded-xl border-4 border-black" frameborder="0"></iframe></div></main><footer class="shrink-0 mt-auto"><div class="max-w-7xl mx-auto px-4 py-1 flex justify-center items-center"><p class="font-mono text-[10px]">&copy; <script>document.write(new Date().getFullYear())</script> Christopher Tyler. All rights reserved.</p></div></footer><script>const frame=document.getElementById('portfolio-frame');const backBtn=document.getElementById('back-btn');const nextBtn=document.getElementById('next-btn');const navLinks={index:document.getElementById('nav-index'),process:document.getElementById('nav-process'),contact:document.getElementById('nav-contact')};const noVideoPages=new Set(['organon/index.html']);const projectOrder=['foreverbound/index.html','calloftheconch/index.html','backroom/index.html','organon/index.html','cremationcountdown/index.html','christinadior/index.html','sopscout/index.html','process/index.html'];function normalizePage(page){return (page||'').replace(/^\.\//,'').replace(/^\//,'')}function setActiveNav(page){page=normalizePage(page);Object.values(navLinks).forEach(link=>link&&link.classList.remove('active'));let key=null;if(page==='indexpanel.html'||page==='')key='index';else if(page==='process/index.html')key='process';else if(page==='contact.html')key='contact';if(key&&navLinks[key])navLinks[key].classList.add('active')}function showBack(){backBtn.style.display='inline-flex'}function showIndex(){backBtn.style.display='none';nextBtn.style.display='none';setActiveNav('indexpanel.html')}function updateProjectNav(page){page=normalizePage(page);setActiveNav(page);if(page==='indexpanel.html'||page===''){showIndex();return}backBtn.style.display='inline-flex';nextBtn.style.display=projectOrder.includes(page)?'inline-flex':'none'}function loadProject(url){if(!url)return;frame.src=url;updateProjectNav(url)}function goHome(){frame.src='indexpanel.html';showIndex()}function goNext(){const page=normalizePage(framePage());const i=projectOrder.indexOf(page);if(i<0)return;const next=projectOrder[(i+1)%projectOrder.length];frame.src=next;updateProjectNav(next)}function framePage(){let page=frame.getAttribute('src')||'';try{const path=frame.contentWindow.location.pathname;const marker='/ChristopherTyler/';const i=path.indexOf(marker);if(i>=0)page=path.slice(i+marker.length)}catch(e){}return normalizePage(page)}function tuneFrame(){try{const doc=frame.contentDocument;if(!doc)return;const page=framePage();updateProjectNav(page);if(page==='process/index.html'){const processStyle=doc.createElement('style');processStyle.textContent='html,body{scrollbar-width:thin!important;scrollbar-color:#D4FF00 #111!important}html::-webkit-scrollbar,body::-webkit-scrollbar{width:10px!important}html::-webkit-scrollbar-track,body::-webkit-scrollbar-track{background:#111!important}html::-webkit-scrollbar-thumb,body::-webkit-scrollbar-thumb{background:#D4FF00!important;border-radius:10px!important;border:2px solid #111!important}.flow-box:nth-of-type(1){border-color:#00F0FF!important}.flow-box:nth-of-type(2){border-color:#9A48FF!important}.flow-box:nth-of-type(3){border-color:#00F0FF!important}.flow-box:nth-of-type(4){border-color:#D4FF00!important}.flow-box:nth-of-type(5){border-color:#9A48FF!important}';doc.head.appendChild(processStyle)}if(doc.querySelector('.project-layout')){const style=doc.createElement('style');style.textContent='*,*::before,*::after{box-sizing:border-box!important}html,body{width:100%!important;height:100%!important;min-height:0!important}body{height:100%!important;min-height:0!important;overflow:hidden!important;text-shadow:0 2px 4px rgba(0,0,0,.82)}.project-layout{height:100%!important;min-height:0!important;min-width:0!important;overflow:hidden!important}.left-column{min-height:0!important;min-width:0!important;overflow:hidden!important}.panel,.text-panel,.image-panel{min-height:0!important;min-width:0!important}.text-panel,.image-panel{overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-gutter:stable!important}.image-panel{padding-bottom:3.5rem!important}.image-panel::after{content:"";display:block!important;flex:0 0 2rem!important;height:2rem!important}.image-stack-img{display:block!important;flex-shrink:0!important}';doc.head.appendChild(style);doc.querySelectorAll('.image-panel img').forEach((img,i)=>{if(i>0)img.loading='lazy';img.decoding='async'})}const video=doc.querySelector('.video-panel video');if(video){video.removeAttribute('autoplay');video.removeAttribute('muted');video.autoplay=false;video.muted=false;video.preload='metadata';video.pause();const revealVideo=()=>{video.removeAttribute('poster');video.style.background='#000'};video.addEventListener('play',revealVideo);video.addEventListener('playing',revealVideo);video.addEventListener('timeupdate',()=>{if(video.currentTime>0)revealVideo()});if(noVideoPages.has(page)){const img=doc.createElement('img');img.src=video.getAttribute('poster')||'01.png';img.alt='Project preview';img.style.cssText='display:block;width:100%;height:100%;object-fit:cover;background:#000';video.replaceWith(img)}}}catch(e){console.warn('Frame tuning skipped',e)}}frame.addEventListener('load',tuneFrame);window.addEventListener('message',event=>{if(event.data&&event.data.action==='loadProject'&&event.data.url)loadProject(event.data.url)});</script></body></html>
