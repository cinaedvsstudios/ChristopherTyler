<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Christopher Tyler | AI Motion + Creative AI</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{'brand-offwhite':'#F4F4F0','brand-grey':'#8A8D91','brand-charcoal':'#1C1D21','brand-cyan':'#00F0FF','brand-lime':'#D4FF00','brand-violet':'#8A2BE2'},fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{width:100%;height:100%}body{background:#F4F4F0;color:#1C1D21}.nav-link{position:relative}.nav-link::after{content:'';position:absolute;width:0;height:2px;bottom:-4px;left:0;background:#00F0FF;transition:width .2s ease}.nav-link:hover::after{width:100%}.bg-grid{background-color:#F4F4F0;background-image:url('bg.jpg');background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed}header,header *,#back-btn,footer,footer *{text-shadow:0 2px 5px rgba(255,255,255,.82),0 2px 3px rgba(0,0,0,.35)}iframe{display:block}</style></head><body class="font-sans antialiased h-screen overflow-hidden flex flex-col bg-grid"><main class="flex-grow pt-4 pb-2 px-4 md:px-8 max-w-7xl mx-auto w-full flex flex-col min-h-0"><header class="mb-2 max-w-full ml-auto text-right flex flex-col items-end shrink-0"><h1 class="text-4xl md:text-5xl lg:text-6xl font-bold tracking-tighter text-brand-charcoal mb-1 leading-tight">CHRISTOPHER TYLER</h1><div class="flex flex-row items-center justify-end"><h2 class="text-sm md:text-lg lg:text-xl font-mono text-brand-cyan border-r-4 border-brand-lime pr-4 py-1 inline-block">CREATIVE AI MULTIMEDIA PORTFOLIO</h2><nav class="flex space-x-3 md:space-x-5 text-[10px] md:text-xs font-mono tracking-wider pl-4"><a href="indexpanel.html" target="portfolio-frame" onclick="showIndex()" class="nav-link text-brand-charcoal font-semibold">INDEX</a><a href="about.html" target="portfolio-frame" onclick="showBack()" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">ABOUT</a><a href="portfolio.pdf" target="_blank" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">PDF</a><a href="contact.html" target="portfolio-frame" onclick="showBack()" class="nav-link text-brand-grey hover:text-brand-cyan transition-colors">CONTACT</a></nav></div></header><div class="relative w-full flex-grow min-h-0 mt-2"><button id="back-btn" onclick="goHome()" style="display:none" class="absolute -top-6 left-0 font-mono text-xs font-bold text-brand-charcoal hover:text-brand-violet transition-colors flex items-center z-10 cursor-pointer"><span class="mr-1">←</span> BACK</button><iframe id="portfolio-frame" name="portfolio-frame" src="indexpanel.html" title="Portfolio Content" class="absolute inset-0 w-full h-full bg-black rounded-xl shadow-2xl border-4 border-black" frameborder="0"></iframe></div></main><footer class="bg-brand-offwhite shrink-0 mt-auto"><div class="max-w-7xl mx-auto px-4 py-1 flex justify-center items-center"><p class="font-mono text-brand-grey text-[10px]">&copy; <script>document.write(new Date().getFullYear())</script> Christopher Tyler. All rights reserved.</p></div></footer><script>const frame=document.getElementById('portfolio-frame');const backBtn=document.getElementById('back-btn');const noVideoPages=new Set(['foreverbound/index.html','organon/index.html','sopscout/index.html']);function showBack(){backBtn.style.display='inline-flex'}function showIndex(){backBtn.style.display='none'}function loadProject(url){if(!url)return;frame.src=url;showBack()}function goHome(){frame.src='indexpanel.html';showIndex()}function framePage(){let page=frame.getAttribute('src')||'';try{const path=frame.contentWindow.location.pathname;const marker='/ChristopherTyler/';const i=path.indexOf(marker);if(i>=0)page=path.slice(i+marker.length)}catch(e){}return page}function tuneFrame(){try{const doc=frame.contentDocument;if(!doc)return;const page=framePage();if(doc.querySelector('.project-layout')){const style=doc.createElement('style');style.textContent='*,*::before,*::after{box-sizing:border-box!important}html,body{width:100%!important;height:100%!important;min-height:0!important}body{height:100%!important;min-height:0!important;overflow:hidden!important;text-shadow:0 2px 4px rgba(0,0,0,.82)}.project-layout{height:100%!important;min-height:0!important;min-width:0!important;overflow:hidden!important}.left-column{min-height:0!important;min-width:0!important;overflow:hidden!important}.panel,.text-panel,.image-panel{min-height:0!important;min-width:0!important}.text-panel,.image-panel{overflow-y:auto!important;overscroll-behavior:contain!important;scrollbar-gutter:stable!important}.image-panel{padding-bottom:3.5rem!important}.image-panel::after{content:"";display:block!important;flex:0 0 2rem!important;height:2rem!important}.image-stack-img{display:block!important;flex-shrink:0!important}';doc.head.appendChild(style);doc.querySelectorAll('.image-panel img').forEach((img,i)=>{if(i>0)img.loading='lazy';img.decoding='async'})}const video=doc.querySelector('.video-panel video');if(video){video.removeAttribute('autoplay');video.removeAttribute('muted');video.autoplay=false;video.muted=false;video.preload='none';video.pause();if(noVideoPages.has(page)){const img=doc.createElement('img');img.src=video.getAttribute('poster')||'01.png';img.alt='Project preview';img.style.cssText='display:block;width:100%;height:100%;object-fit:cover;background:#000';video.replaceWith(img)}}}catch(e){console.warn('Frame tuning skipped',e)}}frame.addEventListener('load',tuneFrame);window.addEventListener('message',event=>{if(event.data&&event.data.action==='loadProject'&&event.data.url)loadProject(event.data.url)});</script></body></html>
