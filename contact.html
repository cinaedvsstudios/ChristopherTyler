;object-fit:cover;object-position:center}@media(max-width:700px){.contact-panel{padding:16px;gap:10px}.contact-grid{gap:8px}.info-row{padding:9px 12px}.contact-label{font-size:7px;margin-bottom:3px}.contact-value,.contact-value a{font-size:11px}.studio a{font-size:10px}.subtitle{font-size:9px}h1{font-size:28px}}</style></head><body><main class="contact-panel"><header class="contact-header"><h1>GET IN TOUCH</h1><p class="subtitle">Creative AI · Motion · Digital Production</p></header><section class="contact-grid"><div class="quad info-group"><div class="info-row"><div class="contact-label">Email</div><div class="contact-value"><a href="mailto:kristoffertyler@gmail.com">kristoffertyler@gmail.com</a></div></div><div class="info-row"><div class="contact-label">Phone</div><div class="contact-value"><a href="tel:+4915510902908">+49 155 10902908</a></div></div><div class="info-row"><div class="contact-label">Location</div><div class="contact-value">Berlin, Germany</div></div></div><div class="quad image-cell"><img src="process/01.jpg" alt="Christopher Tyler creative work"></div><div class="quad image-cell"><img src="process/02.jpg" alt="Christopher Tyler creative work"></div><div class="quad info-group"><div class="info-row linkedin"><div class="contact-label">LinkedIn</div><div class="contact-value"><a href="https://www.linkedin.com/in/christopher-tyler-5ab8b683" target="_blank" rel="noopener noreferrer">Christopher Tyler ↗</a></div></div><div class="info-row github"><div class="contact-label">GitHub</div><div class="contact-value"><a href="https://github.com/cinaedvsstudios" target="_blank" rel="noopener noreferrer">cinaedvsstudios ↗</a></div></div><div class="info-row studio"><div class="contact-label">Independent Studio</div><div class="contact-value"><a href="https://cinaedvsstudios.github.io/cinaedvs" target="_blank" rel="noopener noreferrer">CINAEDVS STUDIOS ↗</a></div></div></div></section></main></body></html>
